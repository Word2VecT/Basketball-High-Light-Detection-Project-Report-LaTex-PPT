# ByteTrack tracker defaults for mode="track"
# Docs: https://docs.ultralytics.com/modes/track/

tracker_type: bytetrack
track_high_thresh: 0.6      # 不变或微降
track_low_thresh: 0.2       # 不变
new_track_thresh: 0.35      # 稍提高，防止乱建轨迹
track_buffer: 50            # 核心：大幅延长存活期
match_thresh: 0.65          # 核心：降低匹配门槛
fuse_score: True